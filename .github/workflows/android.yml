name: PDF Plus Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PDF Plus APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Set Android Compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              path = groovy
              patterns = [
                  (r'(?m)^(\s*)compileSdkVersion\s+.*$',
                   r'\g<1>compileSdkVersion 36'),
                  (r'(?m)^(\s*)compileSdk\s+.*$',
                   r'\g<1>compileSdk 36'),
              ]
          elif kotlin.exists():
              path = kotlin
              patterns = [
                  (r'(?m)^(\s*)compileSdk\s*=.*$',
                   r'\g<1>compileSdk = 36'),
                  (r'(?m)^(\s*)compileSdk\s+.*$',
                   r'\g<1>compileSdk = 36'),
              ]
          else:
              raise SystemExit("Android app Gradle file not found")

          content = path.read_text()
          original = content

          for pattern, replacement in patterns:
              content = re.sub(pattern, replacement, content)

          if content == original:
              raise SystemExit("Could not find compileSdk setting")

          path.write_text(content)
          print(f"Updated {path} to compile SDK 36")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Fix file_picker Compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache/hosted/pub.dev"
          files = list(root.glob("file_picker-*/android/build.gradle"))
          files += list(root.glob("file_picker-*/android/build.gradle.kts"))

          if not files:
              raise SystemExit("file_picker Gradle file not found")

          for path in files:
              content = path.read_text()
              updated = re.sub(
                  r'(?m)^(\s*compileSdkVersion\s+).+$',
                  r'\g<1>36',
                  content
              )
              updated = re.sub(
                  r'(?m)^(\s*compileSdk\s*=?\s*).+$',
                  r'\g<1>36',
                  updated
              )

              if updated == content:
                  raise SystemExit(f"Could not update Compile SDK in {path}")

              path.write_text(updated)
              print(f"Updated {path} to Compile SDK 36")
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload PDF Plus APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Plus-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
