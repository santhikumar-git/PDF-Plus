
cd ~/PDFPLUS
mkdir -p .github/workflows

cat > .github/workflows/android.yml <<'YAML'
name: PDF Plus Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Fix file_picker compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache/hosted/pub.dev"
          files = list(root.glob("file_picker-*/android/build.gradle"))

          if not files:
              raise SystemExit("file_picker Android Gradle file not found")

          for path in files:
              content = path.read_text()

              updated, count = re.subn(
                  r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)\d+\b",
                  r"\g<1>36",
                  content
              )

              if count == 0:
                  raise SystemExit(
                      f"Could not update compileSdk in {path}"
                  )

              path.write_text(updated)
              print(f"Updated compileSdk to 36: {path}")
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Plus-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
YAML

