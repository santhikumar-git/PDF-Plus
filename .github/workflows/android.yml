
name: PDF Plus Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --project-name pdf_plus --org com.pdfplus .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Update Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          for path in files:
              if path.exists():
                  content = path.read_text()
                  content = content.replace(
                      "flutter.compileSdkVersion", "36"
                  )
                  content = content.replace(
                      "flutter.compileSdkVersion", "36"
                  )
                  path.write_text(content)
                  print(f"Updated {path}")
                  break
          else:
              raise SystemExit("Android Gradle file not found")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Plus-Android
          path: build/app/outputs/flutter-apk/app-release.apk

