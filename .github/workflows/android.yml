name: PDF Plus Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --project-name pdf_plus --org com.pdfplus .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Update Android app compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          for path in files:
              if path.exists():
                  content = path.read_text()
                  updated = content.replace("flutter.compileSdkVersion", "36")
                  if updated == content:
                      raise SystemExit("Could not find compileSdkVersion in " + str(path))
                  path.write_text(updated)
                  print("Updated app compile SDK to 36:", path)
                  break
          else:
              raise SystemExit("Android Gradle file not found")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Update file_picker compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache/hosted/pub.dev"
          files = list(root.glob("file_picker-*/android/build.gradle"))

          if not files:
              raise SystemExit("file_picker Android Gradle file not found")

          for path in files:
              content = path.read_text()
              updated = content.replace("flutter.compileSdkVersion", "36")
              updated, count = re.subn(
                  r"(?m)^(\s*compileSdkVersion\s+)\d+",
                  r"\g<1>36",
                  updated
              )
              updated, count2 = re.subn(
                  r"(?m)^(\s*compileSdk\s*=\s*)\d+",
                  r"\g<1>36",
                  updated
              )

              if updated == content:
                  print(content)
                  raise SystemExit("Could not update file_picker compile SDK")

              path.write_text(updated)
              print("Updated file_picker compile SDK to 36:", path)
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Plus-Android
          path: build/app/outputs/flutter-apk/app-release.apk
