cat > .github/workflows/android.yml <<'YAML'
name: PDF Plus Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PDF Plus APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Set Android Compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          files = [p for p in files if p.exists()]

          if not files:
              raise SystemExit("Android app Gradle file not found")

          for path in files:
              content = path.read_text()

              pattern = re.compile(
                  r"(?m)^([ \t]*)(compileSdkVersion|compileSdk)\b[^\r\n]*$"
              )

              if pattern.search(content):
                  updated = pattern.sub(
                      lambda m: (
                          m.group(1)
                          + ("compileSdk = 36" if path.suffix == ".kts"
                             else "compileSdkVersion 36")
                      ),
                      content,
                      count=1
                  )
              else:
                  android = re.search(
                      r"(?m)^([ \t]*)android\s*\{",
                      content
                  )

                  if not android:
                      raise SystemExit(
                          f"Android block not found in {path}"
                      )

                  indent = android.group(1) + "    "
                  sdk_line = (
                      "compileSdk = 36"
                      if path.suffix == ".kts"
                      else "compileSdkVersion 36"
                  )

                  updated = (
                      content[:android.end()]
                      + "\n"
                      + indent
                      + sdk_line
                      + content[android.end():]
                  )

              path.write_text(updated)
              print(f"Configured Android SDK 36: {path}")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Fix file_picker Compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache/hosted/pub.dev"

          files = list(root.glob("file_picker-*/android/build.gradle"))
          files += list(root.glob("file_picker-*/android/build.gradle.kts"))

          if not files:
              raise SystemExit("file_picker Gradle file not found")

          for path in files:
              content = path.read_text()

              pattern = re.compile(
                  r"(?m)^([ \t]*)(compileSdkVersion|compileSdk)\b[^\r\n]*$"
              )

              if pattern.search(content):
                  sdk_line = (
                      "compileSdk = 36"
                      if path.suffix == ".kts"
                      else "compileSdkVersion 36"
                  )

                  updated = pattern.sub(
                      lambda m: m.group(1) + sdk_line,
                      content,
                      count=1
                  )
              else:
                  android = re.search(
                      r"(?m)^([ \t]*)android\s*\{",
                      content
                  )

                  if not android:
                      raise SystemExit(
                          f"Android block not found in {path}"
                      )

                  indent = android.group(1) + "    "
                  sdk_line = (
                      "compileSdk = 36"
                      if path.suffix == ".kts"
                      else "compileSdkVersion 36"
                  )

                  updated = (
                      content[:android.end()]
                      + "\n"
                      + indent
                      + sdk_line
                      + content[android.end():]
                  )

              path.write_text(updated)
              print(f"Configured file_picker SDK 36: {path}")
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload PDF Plus APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Plus-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
YAML
